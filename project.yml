name: GameLauncher
options:
  bundleIdPrefix: com.troll
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
targets:
  GameLauncher:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: GameLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troll.gamelauncher
        PRODUCT_NAME: GameLauncher
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: GameLauncher/Info.plist
      properties:
        CFBundleDisplayName: 游戏启动器
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationQueriesSchemes:
          - utms
          - utm
          - jitstreamer
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: GameLauncher/GameLauncher.entitlements
      properties:
        get-task-allow: true
        com.apple.security.cs.allow-jit: true
schemes:
  GameLauncher:
    build:
      targets:
        GameLauncher: all
    run:
      config: Debug
    archive:
      config: Release
